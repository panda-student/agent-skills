<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    ============================================================
    JMBOS UI/UE 设计产物
    ============================================================
    产物编号: D-004
    页面名称: 日志管理
    页面类型: 列表页
    所属模块: 系统管理
    路由ID: sys-log
    需求来源: 骨架模板（示例）
    所属迭代: page-shells
    最后更新: 2026-08-31
    ============================================================
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日志管理 - JOMOO九牧</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    /* .main-wrapper / .main-content / .page-card 已在 common.css 中定义，此处不再重复 */
    /* ⭐ 覆盖 common.css：列表页 .page-card 禁止整体滚动，分页固定底部 */
    .page-card {
      overflow: hidden !important;                  /* ⭐ 强制覆盖 common.css 的 overflow-y: auto */
    }

    .query-bar {
      padding: var(--spacing-base);
      border-bottom: 1px solid var(--color-bg-divider);
      background-color: #FFFFFF;
      flex-shrink: 0;                               /* ⭐ 固定不被压缩 */
    }

    .query-row {
      display: flex;
      gap: 16px;
      align-items: flex-end;
    }

    .query-item {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .query-label {
      font-size: var(--font-size-sm);
      color: #141b24;
      white-space: nowrap;
      width: 72px;
      min-width: 72px;
      text-align: right;
    }

    .query-input,
    .query-select {
      flex: 1;                               /* 自适应宽度：填满列内剩余空间 */
      min-width: 0;                          /* 防止内容撑破 flex 容器 */
      height: 28px;
      padding: 6px 8px;
      border: 1px solid var(--color-bg-border);
      border-radius: var(--radius-r2);
      font-size: 12px;
      color: #141b24;
      background-color: var(--color-bg-card);
      transition: all var(--transition-fast);
    }

    .query-input::placeholder {
      color: var(--color-text-tertiary);
    }

    .query-input:hover,
    .query-select:hover {
      border-color: var(--color-primary-hover);
    }

    .query-input:focus,
    .query-select:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(54, 133, 242, 0.2);
    }

    /* ⭐ 下拉选项悬停时文字不变色，仅改变背景色 */
    .query-select option:hover,
    .query-select option:focus,
    .query-select option:active,
    .query-select option:checked {
      color: var(--color-text-primary);
      background-color: var(--color-bg-hover);
    }

    .query-select {
      appearance: none;
      padding-right: 28px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2.57573593,5.07573593 C2.78401555,4.86745631 3.10732483,4.84431413 3.3411666,5.00630939 L3.42426407,5.07573593 L8,9.651 L12.5757359,5.07573593 C12.7840156,4.86745631 13.1073248,4.84431413 13.3411666,5.00630939 L13.4242641,5.07573593 C13.6325437,5.28401555 13.6556859,5.60732483 13.4936906,5.8411666 L13.4242641,5.92426407 L8.42426407,10.9242641 C8.21598445,11.1325437 7.89267517,11.1556859 7.6588334,10.9936906 L7.57573593,10.9242641 L2.57573593,5.92426407 C2.34142136,5.68994949 2.34142136,5.31005051 2.57573593,5.07573593 Z' fill='%237C8493' fill-rule='nonzero'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 12px;
    }

    .query-actions {
      display: flex;
      gap: var(--spacing-sm);
      flex: 1;                               /* ⭐ 4等分：按钮区占1/4空间 */
      min-width: 0;
      justify-content: flex-end;             /* ⭐ 右对齐 */
    }

    /* ===== 查询栏按钮样式（规范 v4.3）===== */
    .btn {
      padding: 6px 12px;                               /* ⭐ 规范：默认尺寸（查询栏专用）*/
      border-radius: var(--radius-r2);
      font-size: var(--font-size-body);                /* ⭐ 12px */
      cursor: pointer;
      border: 1px solid transparent;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 28px;
      white-space: nowrap;
      font-family: inherit;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: var(--color-text-white);
      border-color: var(--color-primary);
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover);
      border-color: var(--color-primary-hover);
    }

    .btn-primary:active {
      background-color: var(--color-primary-active);
      border-color: var(--color-primary-active);
    }

    .btn-default {
      background-color: var(--color-bg-card);
      border: none;
      color: #7C8493;
    }

    .btn-default:hover {
      background-color: rgba(54, 133, 242, 0.10);
    }

    .btn-danger {
      background-color: var(--color-error);
      color: var(--color-text-white);
      border: none;
    }
    .btn-danger:hover {
      background-color: var(--color-error-hover);
    }
    .btn-danger:active {
      background-color: var(--color-error-active);
    }

    /* ===== 次按钮 (Secondary) - 查询栏专用 ===== */
    .btn-secondary {
      background-color: var(--color-bg-card);
      color: var(--color-text-secondary);
      border: 1px solid var(--color-bg-border);
      border-radius: var(--radius-r2);
      padding: 6px 12px;                               /* ⭐ 规范：默认尺寸（查询栏专用）*/
      font-size: var(--font-size-body);                /* ⭐ 12px */
      cursor: pointer;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      font-family: inherit;
      height: 28px;
    }

    .btn-secondary:hover {
      border-color: var(--color-primary-hover);
      color: var(--color-primary-hover);
    }

    /* ===== 操作按钮组样式（规范 v4.3）===== */
    .action-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;                             /* ⭐ 上下 8px，左右 12px */
      flex-shrink: 0;                               /* ⭐ 固定不被压缩 */
    }

    /* ===== 标准样式选项卡 .tabs（规范见 tabs.md v1.2.0）====== */
    .tabs {
      height: 40px;
      display: flex;
      align-items: stretch;
      gap: var(--spacing-base);              /* 16px 选项间距 */
      overflow: hidden;
      padding: 0 12px;                       /* 与表格左右间距对齐 */
      flex-shrink: 0;                        /* ⭐ 固定不被压缩 */
    }
    .tabs .tab-item {
      display: flex;
      align-items: center;
      padding: 0;                            /* 左右无内边距，确保色块与文字等宽 */
      font-size: var(--font-size-base);      /* 13px */
      font-weight: var(--font-weight-regular); /* 400 不加粗 */
      color: var(--color-text-primary);      /* #141b24 一级色 */
      cursor: pointer;
      border-bottom: 2px solid transparent;   /* 默认透明占位防跳动，在 40px 内部 */
      border-top: none;
      border-left: none;
      border-right: none;
      background: none;
      box-sizing: border-box;
      transition: color var(--transition-fast), border-color var(--transition-fast);
      white-space: nowrap;
    }
    .tabs .tab-item.is-active {
      color: var(--color-primary);           /* #3685F2 主题蓝 */
      border-bottom-color: var(--color-primary); /* 2px 色块与文字等宽 */
      font-weight: var(--font-weight-semibold); /* 600 加粗 */
    }
    .tabs .tab-item:not(.is-active):hover {
      color: var(--color-primary-hover);     /* #5E9DF5 悬停态 */
    }
    .tabs .tab-item:not(.is-active):active {
      color: var(--color-primary-active);    /* #2364CC 点击态 */
    }

    /* ===== 主按钮 (Primary) - 查询栏专用（.action-bar 内禁止使用 .btn-primary，统一用 .btn-default）===== */

    /* ===== 普通按钮 (Default) ⭐ 列表页专用 - 仅限操作按钮组 ===== */
    .action-bar .btn-default {
      background-color: var(--color-bg-card);
      color: var(--color-text-secondary);
      border: none;
      border-radius: var(--radius-r2);
      padding: 4px 8px;
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-regular);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      height: 24px;
    }

    .action-bar .btn-default:hover {
      background-color: rgba(54, 133, 242, 0.10);
    }

    .action-bar .btn-default:active {
      background-color: rgba(54, 133, 242, 0.20);
    }

    .action-bar .btn-default:disabled {
      color: var(--color-text-disabled);
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* ===== "更多操作"按钮（文字 + chevron-down 图标）===== */
    .btn-more-text {
      background: none;
      border: none;
      color: var(--color-text-secondary);
      padding: 4px 8px;
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-regular);
      cursor: pointer;
      border-radius: var(--radius-r2);
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      height: 24px;
    }

    .btn-more-text:hover {
      background-color: rgba(54, 133, 242, 0.10);   /* ⭐ 与 .btn-default:hover 一致：仅背景色变化，文字/图标颜色不变 */
    }

    .btn-more-text:active {
      background-color: rgba(54, 133, 242, 0.20);   /* ⭐ 与 .btn-default:active 一致：仅背景色变化 */
    }

    .btn-more-text .icon {
      width: 16px;
      height: 16px;
      color: inherit;
      flex-shrink: 0;
    }

    /* ===== 图标样式（操作按钮组内）已合并至基础 .icon 类 ===== */

    .table-container {
      overflow-y: auto;                              /* ⭐ 表格区域独立滚动，分页固定底部 */
      overflow-x: auto;
      padding: 0 12px;                               /* ⭐ 表格左右 12px 间距留白 */
      flex: 1;                                       /* ⭐ 撑满剩余空间，将分页推到底部 */
      min-height: 0;                                 /* ⭐ flex 子元素必须设置，否则不收缩 */
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table thead {
      background-color: var(--color-bg-header);
    }

    .data-table th {
      padding: var(--spacing-sm) var(--spacing-base);
      text-align: left;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      background-color: var(--color-bg-header);          /* ⭐ 符合 tables.md 规范 */
      border-right: 1px solid var(--color-bg-divider);   /* ⭐ 符合 tables.md 规范：垂直分割线 */
      border-bottom: none;                               /* ⭐ 符合 tables.md 规范：无水平分割线 */
      white-space: nowrap;
      position: relative;
    }
    /* 最后一个表头单元格不需要右侧分割线 */
    .data-table th:last-child {
      border-right: none;
    }

    /* ====== 列排序样式 ====== */
    .sortable {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      max-width: 100%;
      box-sizing: border-box;
    }

    .sortable-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      flex: 0 0 auto;
      min-width: 0;
    }

    .sort-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 10px;
      height: auto;
      min-height: 24px;
      gap: 3px;
      flex-shrink: 0;
    }

    .sort-icon .arrow-up,
    .sort-icon .arrow-down {
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      transition: all 0.2s ease;
    }

    .sort-icon .arrow-up {
      border-bottom: 5px solid var(--color-text-secondary);    /* #7C8493 */
    }

    .sort-icon .arrow-down {
      border-top: 5px solid var(--color-text-secondary);       /* #7C8493 */
    }

    .sortable.asc .sort-icon .arrow-up {
      border-bottom-color: var(--color-primary);              /* #3685F2 */
    }

    .sortable.desc .sort-icon .arrow-down {
      border-top-color: var(--color-primary);                 /* #3685F2 */
    }

    .data-table td {
      padding: var(--spacing-sm) var(--spacing-base);
      font-size: var(--font-size-sm);
      border-bottom: 1px solid var(--color-bg-divider);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: var(--table-cell-max-width);
    }

    .data-table tbody tr:hover {
      background-color: var(--color-bg-hover);
    }

    .checkbox-cell {
      width: 40px;
      text-align: center;
    }

    /* 表格多选框自定义样式 */
    .checkbox-cell input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border: 1px solid var(--color-bg-border);    /* #D2D7E1 边框颜色 */
      border-radius: 2px;
      background-color: var(--color-bg-card);      /* #FFFFFF 白色背景 */
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      vertical-align: middle;
    }

    .checkbox-cell input[type="checkbox"]:hover {
      border-color: var(--color-primary-hover);    /* #5E9DF5 悬停边框 */
    }

    .checkbox-cell input[type="checkbox"]:checked {
      background-color: var(--color-primary);      /* #3685F2 选中背景 */
      border-color: var(--color-primary);          /* #3685F2 选中边框 */
    }

    .checkbox-cell input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 8px;
      border: solid #FFFFFF;
      border-width: 0 2px 2px 0;
      border-radius: 1px;
      transform: translate(-42%, -58%) rotate(45deg);
    }

    .checkbox-cell input[type="checkbox"]:disabled {
      background-color: var(--color-bg-header);    /* #F4F7F9 禁用背景 */
      border-color: var(--color-bg-border);        /* #D2D7E1 禁用边框 */
      cursor: not-allowed;
    }

    .checkbox-cell input[type="checkbox"]:disabled:checked {
      background-color: var(--color-primary-disabled); /* #AFCEFA 禁用选中 */
      border-color: var(--color-primary-disabled);
    }

    .action-col {
      min-width: var(--table-action-col-min-width);
      overflow: visible !important;                  /* ⭐ 允许下拉菜单溢出显示 */
    }
    /* ⭐ 操作列的 td 也需要 visible，避免裁剪下拉菜单 */
    .data-table td.action-col,
    .data-table td:last-child {
      overflow: visible;
    }

    .action-links {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      overflow: visible;                             /* ⭐ 允许下拉菜单溢出 */
    }

    .link-btn {
      color: var(--color-primary);
      text-decoration: none;
      font-size: var(--font-size-sm);
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
    }

    .link-btn:hover {
      color: var(--color-primary-active);
    }

    /* ⭐ "更多"按钮容器（相对定位，承载下拉菜单）— 规范 tables.md */
    .more-action-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    /* ⭐ "更多"按钮（图标）— 规范 tables.md：唯一允许使用图标的操作按钮 */
    .more-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      padding: 4px;
      cursor: pointer;
      border-radius: var(--radius-r1);
      transition: all var(--transition-fast);
    }
    .more-action-btn svg {
      width: 16px;
      height: 16px;
      color: var(--color-primary);
    }
    .more-action-btn:hover svg { color: var(--color-primary-hover); }
    .more-action-btn:active svg { color: var(--color-primary-active); }

    /* ⭐ 更多下拉菜单（规范 tables.md） */
    .action-dropdown {
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 4px;
      background-color: var(--color-bg-card);
      border: none;
      border-radius: var(--radius-r2);
      box-shadow: var(--shadow-s2);
      min-width: 120px;
      padding: 4px 0;
      z-index: 9999;                                 /* ⭐ 提高层级，防止被表格项遮挡 */
      display: none !important;                 /* ⭐ 强制隐藏，防止被覆盖 */
    }
    .action-dropdown.show { display: block !important; }
    .action-dropdown-item {
      display: block;
      width: 100%;
      padding: 8px 16px;
      background: none;
      border: none;
      color: var(--color-text-primary);
      font-size: var(--font-size-body);
      text-align: left;
      cursor: pointer;
      transition: all var(--transition-fast);
      font-family: inherit;
    }
    .action-dropdown-item:hover {
      background-color: var(--color-bg-hover);
      /* ⭐ 仅背景色变化，文字颜色不变 */
    }

    .pagination-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-sm) 12px;               /* ⭐ 左右 12px 与表格对齐 */
      flex-shrink: 0;                                /* ⭐ v5.1.3: 防止分页被压缩 */
    }

    .pagination-info {
      font-size: var(--font-size-sm);
      color: var(--color-text-primary);
    }

    .pagination-info .count {
      color: var(--color-primary);
      font-weight: var(--font-weight-semibold);
    }

    .pagination {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }

    .page-size-select {
      height: 24px;
      padding: 0 28px 0 8px;
      border: 1px solid var(--color-bg-border);
      border-radius: var(--radius-r2);
      font-size: var(--font-size-sm);
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2.57573593,5.07573593 C2.78401555,4.86745631 3.10732483,4.84431413 3.3411666,5.00630939 L3.42426407,5.07573593 L8,9.651 L12.5757359,5.07573593 C12.7840156,4.86745631 13.1073248,4.84431413 13.3411666,5.00630939 L13.4242641,5.07573593 C13.6325437,5.28401555 13.6556859,5.60732483 13.4936906,5.8411666 L13.4242641,5.92426407 L8.42426407,10.9242641 C8.21598445,11.1325437 7.89267517,11.1556859 7.6588334,10.9936906 L7.57573593,10.9242641 L2.57573593,5.92426407 C2.34142136,5.68994949 2.34142136,5.31005051 2.57573593,5.07573593 Z' fill='%237C8493' fill-rule='nonzero'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 6px center;
      background-size: 10px;
      cursor: pointer;
      margin-right: var(--spacing-sm);
    }

    .page-btn {
      min-width: 24px;
      height: 24px;
      padding: 0 4px;
      border: 1px solid var(--color-bg-border);
      border-radius: var(--radius-r2);
      background-color: var(--color-bg-card);
      color: var(--color-text-primary);
      font-size: var(--font-size-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      font-family: inherit;
    }

    .page-btn .icon {
      width: 14px;
      height: 14px;
    }

    .page-btn:hover:not(.active):not(:disabled) {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .page-btn.active {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-text-white);
    }

    .page-btn:disabled {
      color: var(--color-bg-border);
      cursor: not-allowed;
    }

    .page-jump {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      margin-left: var(--spacing-sm);
    }

    .page-jump-input {
      width: 40px;
      height: 24px;
      text-align: center;
      border: 1px solid var(--color-bg-border);
      border-radius: var(--radius-r2);
      font-size: var(--font-size-sm);
    }

    .tag {
      display: inline-block;
      padding: 0 8px;

    /* ========== 弹窗组件（内联，避免跳转） ========== */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(20, 27, 36, 0.45);
      z-index: calc(var(--z-index-modal, 1001) + 1);
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background-color: var(--color-bg-card);
      border-radius: var(--radius-r2);
      box-shadow: var(--shadow-modal);
      display: flex; flex-direction: column;
      position: relative; min-height: calc(36vh / var(--zoom-value, 1)); max-height: calc(80vh / var(--zoom-value, 1));
      animation: modalSlideIn var(--transition-base) ease-in-out;
    }
    @keyframes modalSlideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-sm { width: 588px; }
    .modal-header {
      background-color: var(--color-primary); color: var(--color-text-white);
      height: 40px; padding: 0 16px; display: flex; align-items: center; flex-shrink: 0;
    }
    .modal-title { font-size: 14px; font-weight: 600; flex: 1; }
    .modal-actions { display: flex; align-items: center; gap: 4px; }
    .modal-action-btn {
      width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
      background: none; border: none; color: var(--color-text-white); cursor: pointer; border-radius: var(--radius-r2);
    }
    .modal-action-btn:hover { background-color: rgba(255, 255, 255, 0.15); }
    .modal-action-btn svg { width: 16px; height: 16px; }
    .modal-body { padding: var(--spacing-base); overflow-y: auto; flex: 1; max-height: calc(80vh / var(--zoom-value, 1) - 110px); }
    .modal-footer { display: flex; justify-content: flex-end; gap: var(--spacing-md); padding: 12px 16px; border-top: 1px solid var(--color-bg-divider); flex-shrink: 0; }
    .modal-section { margin-bottom: 24px; }
    .modal-section:last-child { margin-bottom: 0; }
    .modal-section-title { font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); color: var(--color-primary); margin-bottom: 12px; }
    .modal-form-row { display: flex; gap: var(--spacing-lg); margin-bottom: var(--spacing-lg); }
    .modal-form-row:last-child { margin-bottom: 0; }
    .modal-form-item { flex: 1; min-width: 0; }
    .modal-form-label { display: block; font-size: var(--font-size-sm); color: var(--color-text-primary); margin-bottom: var(--spacing-sm); line-height: 1; }
    .modal-form-label.required::before { content: '*'; color: var(--color-error); margin-right: 2px; }
    .modal-form-input {
      width: 100%; height: 28px; padding: 6px 8px;
      border: 1px solid var(--color-bg-border); border-radius: var(--radius-r2);
      font-size: 12px; color: #141b24; transition: all var(--transition-fast); font-family: inherit;
    }
    .modal-form-input::placeholder { color: var(--color-text-tertiary); }
    .modal-form-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(54, 133, 242, 0.2); }
    .modal-form-select {
      width: 100%; height: 28px; padding: 6px 8px; padding-right: 28px;
      border: 1px solid var(--color-bg-border); border-radius: var(--radius-r2);
      font-size: 12px; color: #141b24; appearance: none; background-color: var(--color-bg-card); cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2.57573593,5.07573593 C2.78401555,4.86745631 3.10732483,4.84431413 3.3411666,5.00630939 L3.42426407,5.07573593 L8,9.651 L12.5757359,5.07573593 C12.7840156,4.86745631 13.1073248,4.84431413 13.3411666,5.00630939 L13.4242641,5.07573593 C13.6325437,5.28401555 13.6556859,5.60732483 13.4936906,5.8411666 L13.4242641,5.92426407 L8.42426407,10.9242641 C8.21598445,11.1325437 7.89267517,11.1556859 7.6588334,10.9936906 L7.57573593,10.9242641 L2.57573593,5.92426407 C2.34142136,5.68994949 2.34142136,5.31005051 2.57573593,5.07573593 Z' fill='%237C8493' fill-rule='nonzero'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right 8px center; background-size: 12px;
    }
    .modal-form-textarea {
      width: 100%; min-height: 60px; padding: 8px 12px;
      border: 1px solid var(--color-bg-border); border-radius: var(--radius-r2);
      font-size: var(--font-size-sm); color: var(--color-text-primary); resize: vertical; font-family: inherit; line-height: 1.5;
    }
    .modal-form-textarea:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(54, 133, 242, 0.2); }

    /* ===== 抽屉详情样式（从右侧滑入，仅详情场景，规范见 drawer.md）===== */
    .drawer-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(20, 27, 36, 0.45);
      z-index: calc(var(--z-index-modal, 1001) + 1);
      opacity: 0; visibility: hidden;
      transition: opacity var(--transition-base, 0.25s), visibility var(--transition-base, 0.25s);
    }
    .drawer-overlay.show { opacity: 1; visibility: visible; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      height: calc(100vh / var(--zoom-value, 1));  /* ⭐ 显式全屏高度，确保底栏固定屏幕底部 */
      width: 800px;
      background-color: var(--color-bg-card);
      z-index: calc(var(--z-index-modal, 1001) + 2);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform var(--transition-base, 0.25s) ease-in-out, width var(--transition-base, 0.25s) ease-in-out;
      box-shadow: var(--shadow-s3, 0 12px 30px rgba(20, 27, 36, 0.18));
    }
    .drawer.show { transform: translateX(0); }
    /* 全屏模式 — 用 calc 抵消 zoom 放大，避免全屏抽屉溢出屏幕 */
    .drawer.drawer-fullscreen { width: calc(100vw / var(--zoom-value, 1)); max-width: calc(100vw / var(--zoom-value, 1)); box-shadow: none; }
    /* 标题区 - 主题蓝色背景，文字/图标反白（与弹窗一致）*/
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      height: 40px; padding: 0 20px;
      background-color: var(--color-primary);
      color: var(--color-text-white);
      flex-shrink: 0;
    }
    .drawer-title {
      font-size: var(--font-size-lg, 14px); font-weight: var(--font-weight-semibold, 600);
      color: var(--color-text-white); margin: 0; flex: 1;
    }
    .drawer-header-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    /* 标题区按钮（切换/关闭）- 反白 */
    .drawer-toggle, .drawer-close {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border: none; background: none; cursor: pointer; padding: 0;
      border-radius: var(--radius-r2, 4px); color: var(--color-text-white);
      transition: background-color var(--transition-fast, 0.15s);
    }
    .drawer-toggle svg, .drawer-close svg { width: 16px; height: 16px; }
    .drawer-toggle:hover, .drawer-close:hover { background-color: rgba(255, 255, 255, 0.15); }
    /* 内容区 - 20px留白，可滚动 */
    .drawer-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; }
    /* 底部操作栏 - 默认不渲染，需求要求时才加 */
    .drawer-footer {
      display: flex; justify-content: flex-end; gap: var(--spacing-md, 12px);
      padding: 20px; border-top: 1px solid var(--color-bg-divider); flex-shrink: 0;
    }
    /* ⭐ 抽屉详情字段（符合 page-types.md 详情页规范 + drawer.md）*/
    .detail-section { margin-bottom: 24px; }
    .detail-section:last-child { margin-bottom: 0; }
    .detail-section-title {
      font-size: var(--font-size-base);              /* ⭐ 13px（规范）*/
      font-weight: var(--font-weight-semibold);       /* ⭐ 600 */
      color: var(--color-primary);                    /* ⭐ #3685F2 主题色（规范）*/
      margin-bottom: 12px;
    }
    /* ⭐ 描述列表网格容器 - 默认3列（抽屉专用，规范见 drawer.md）*/
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;                                      /* ⭐ 行列间距 20px（规范）*/
    }
    .detail-item {
      display: flex;
      flex-direction: row;
      align-items: baseline;
      gap: 4px;                                       /* ⭐ label 与 value 紧密间距（规范）*/
      min-width: 0;
      overflow: hidden;
    }
    .detail-label {
      font-size: var(--font-size-sm);                 /* ⭐ 12px */
      color: var(--color-text-secondary);             /* ⭐ #7C8493 */
      font-weight: var(--font-weight-regular);        /* ⭐ 400 不加粗 */
      white-space: nowrap;
      flex-shrink: 0;
    }
    .detail-label::after {
      content: "：";                                  /* ⭐ 自动添加全角冒号（规范）*/
    }
    .detail-value {
      font-size: var(--font-size-sm);                 /* ⭐ 12px */
      color: var(--color-text-primary);               /* ⭐ #141b24 */
      font-weight: var(--font-weight-regular);        /* ⭐ 400 不加粗 */
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ===== 确认对话框样式 ===== */
    .confirm-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(20, 27, 36, 0.45);
      z-index: calc(var(--z-index-modal, 1001) + 1);
      display: none;
      align-items: center; justify-content: center;
    }
    .confirm-overlay.show { display: flex; }
    .confirm-dialog {
      width: 404px;
      background-color: var(--color-bg-card, #FFFFFF);
      border-radius: var(--radius-r2, 4px);
      box-shadow: var(--shadow-s3, 0 12px 30px rgba(20, 27, 36, 0.18));
      padding: var(--spacing-lg, 20px);
      display: flex; flex-direction: column;
      position: relative;
      animation: confirmSlideIn var(--transition-base, 0.25s) ease-in-out;
    }
    @keyframes confirmSlideIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .confirm-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--spacing-sm, 8px);
    }
    .confirm-title-group {
      display: flex; align-items: center; gap: var(--spacing-xs, 4px);
      flex: 1; min-width: 0;
    }
    .confirm-icon { width: 20px; height: 20px; flex-shrink: 0; }
    .confirm-title {
      font-size: var(--font-size-lg, 14px);
      font-weight: var(--font-weight-semibold, 600);
      color: var(--color-text-primary, #141b24);
      margin: 0; line-height: 1.4;
      flex: 1; min-width: 0;
    }
    .confirm-close {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer; padding: 0;
      color: var(--color-text-secondary, #7C8493);
      border-radius: var(--radius-r2, 4px);
      transition: all var(--transition-fast, 0.15s);
      flex-shrink: 0;
    }
    .confirm-close:hover {
      background-color: var(--color-bg-hover, #EDF3FA);
      color: var(--color-primary, #3685F2);
    }
    .confirm-close .icon { width: 16px; height: 16px; }
    .confirm-body { margin-top: var(--spacing-md, 12px); }
    .confirm-desc {
      font-size: var(--font-size-sm, 12px);
      color: var(--color-text-secondary, #7C8493);
      line-height: var(--line-height-base, 1.5);
      margin: 0;
    }
    .confirm-footer {
      display: flex; justify-content: flex-end;
      gap: var(--spacing-md, 12px);
      margin-top: var(--spacing-lg, 20px);
    }
    .confirm-info .confirm-icon { color: var(--color-primary, #3685F2); }
    .confirm-success .confirm-icon { color: var(--color-primary, #3685F2); }
    .confirm-warning .confirm-icon { color: var(--color-warning, #FF813B); }
    .confirm-warning .btn-warning {
      background-color: var(--color-warning, #FF813B);
      color: var(--color-text-white, #FFFFFF); border: none;
    }
    .confirm-warning .btn-warning:hover { background-color: var(--color-warning-hover, #FFAE81); }
    .confirm-warning .btn-warning:active { background-color: var(--color-warning-active, #D46B08); }
    .confirm-danger .confirm-icon { color: var(--color-error, #FF4D5D); }
    .confirm-danger .btn-danger {
      background-color: var(--color-error, #FF4D5D);
      color: var(--color-text-white, #FFFFFF); border: none;
    }
    .confirm-danger .btn-danger:hover { background-color: var(--color-error-hover, #FF717D); }
    .confirm-danger .btn-danger:active { background-color: var(--color-error-active, #D93649); }
  </style>
</head>
<body>
  <!-- 导航壳挂载点 -->
  <div id="header"></div>

  <!-- 页面内容容器 -->
  <div class="main-wrapper">
    <main class="main-content">
      <div id="tabs-nav-container"></div>
      <div id="page-content">
        <div class="page-card">
          <div class="query-bar">
            <div class="query-row">
              <div class="query-item">
                <label class="query-label">查询条件标题</label>

              </div>
              <div class="query-item">

                <select class="query-select">
                  <option value="">请选择</option>
                  <option value="1">选项一</option>
                  <option value="2">选项二</option>
                </select>
              </div>
              <div class="query-item">
                <label class="query-label">查询条件标题</label>
                <input type="text" class="query-input" placeholder="请输入">

                <button class="btn btn-secondary" onclick="handleReset()">重置</button>
                <button class="btn btn-primary" onclick="handleSearch()">
                  <svg class="icon">
                    <use href="#icon-search"></use>
                  </svg>
                  查询
                </button>
              </div>
            </div>
          </div>

          <div class="action-bar">
            <!-- 列表页工具栏：全部使用 .btn-default（包括新增）-->

            <!-- 新增按钮（列表页专用）：带图标 + 文字 -->
            <button class="btn-default btn-with-icon" onclick="handleAdd()">
              <svg class="icon">
                <use href="#icon-plus"></use>
              </svg>
              新增
            </button>

            <!-- 普通按钮（列表页专用）：纯文字或带图标 -->

              <svg class="icon">
                <use href="#icon-edit"></use>
              </svg>

              <svg class="icon">
                <use href="#icon-export"></use>
              </svg>

        <!-- ========== 抽屉详情：查看角色（从右侧滑入，规范见 drawer.md）========== -->
        <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
        <aside class="drawer" id="detailDrawer">
          <div class="drawer-header">
            <h2 class="drawer-title">角色详情</h2>
            <div class="drawer-header-actions">
              <!-- 尺寸切换按钮（关闭按钮左边）-->
              <button class="drawer-toggle" onclick="toggleDrawerSize()" title="放大">
                <svg class="icon"><use href="#icon-goaway"></use></svg>
              </button>
              <!-- 关闭按钮 -->
              <button class="drawer-close" onclick="closeDrawer()" title="关闭">
                <svg class="icon"><use href="#icon-remove"></use></svg>
              </button>
            </div>
          </div>
          <div class="drawer-body" id="drawerBody">
            <!-- 动态填充 -->
          </div>
          <!-- 底部操作栏默认不提供，需求要求时取消注释 -->
          <!--
          <div class="drawer-footer">
            <button class="btn btn-secondary" onclick="closeDrawer()">取消</button>
            <button class="btn btn-primary" onclick="handleDrawerAction()">确定</button>
          </div>
          -->
        </aside>
      </div>
    </main>
  </div>

  <!-- ===== 确认对话框：删除单条 ===== -->
  <div class="confirm-overlay" id="confirmDelete" onclick="closeConfirmOnOverlay(event, 'confirmDelete')">
    <div class="confirm-dialog confirm-danger">
      <div class="confirm-header">
        <div class="confirm-title-group">
          <svg class="icon confirm-icon"><use href="#icon-warning"></use></svg>
          <h3 class="confirm-title">确认删除该记录？</h3>
        </div>
        <button class="confirm-close" onclick="closeConfirm('confirmDelete')" title="关闭">
          <svg class="icon"><use href="#icon-remove"></use></svg>
        </button>
      </div>
      <div class="confirm-body">
        <p class="confirm-desc" id="confirmDeleteDesc">删除后数据将无法恢复，请谨慎操作。</p>
      </div>
      <div class="confirm-footer">
        <button class="btn btn-secondary" onclick="closeConfirm('confirmDelete')">取消</button>
        <button class="btn btn-danger" onclick="handleDeleteConfirm()">确定删除</button>
      </div>
    </div>
  </div>

  <!-- ===== 确认对话框：批量删除 ===== -->
  <div class="confirm-overlay" id="confirmBatchDelete" onclick="closeConfirmOnOverlay(event, 'confirmBatchDelete')">
    <div class="confirm-dialog confirm-danger">
      <div class="confirm-header">
        <div class="confirm-title-group">
          <svg class="icon confirm-icon"><use href="#icon-warning"></use></svg>
          <h3 class="confirm-title">确认批量删除？</h3>
        </div>
        <button class="confirm-close" onclick="closeConfirm('confirmBatchDelete')" title="关闭">
          <svg class="icon"><use href="#icon-remove"></use></svg>
        </button>
      </div>
      <div class="confirm-body">
        <p class="confirm-desc" id="confirmBatchDeleteDesc">将删除选中的记录，此操作不可撤销。</p>
      </div>
      <div class="confirm-footer">
        <button class="btn btn-secondary" onclick="closeConfirm('confirmBatchDelete')">取消</button>
        <button class="btn btn-danger" onclick="handleBatchDeleteConfirm()">确定删除</button>
      </div>
    </div>
  </div>

  <script>window.__pageId="sys-log";</script>
  <script src="../js/common.js"></script>
  <script src="../js/pages/list.js"></script>
</body>
</html>
